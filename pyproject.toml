# Quality configuration for the easy-ai sync channel.
# Kept in one place so `ruff check` locally and in CI use identical rules.

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "_pages",   # generated by scripts/build_pages.py at deploy time
    ".venv",
    "vault",    # encrypted raw snapshots — never linted, never committed
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes: unused/undefined names
    "I",    # isort: import order
    "B",    # flake8-bugbear: real-world bug patterns (incl. B904 raise-from)
    "UP",   # pyupgrade: modern syntax for the declared target-version
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie: misc lint
    "RET",  # flake8-return
    "RUF",  # ruff-specific rules
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Tests unpack tuples returned by the code under test; an unused side of the
# tuple is documentation, not a bug.
"tests/*" = ["RUF059"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
