# قناة المزامنة الآمنة — Google Drive → المستودع → GitHub Pages
# تعمل كل ساعة، وتُنشر بلوحة عامة بعد التنقيح وبوابة الفحص.
name: secure-sync

on:
  schedule:
    - cron: "17 * * * *"   # كل ساعة عند الدقيقة 17 (تجنب ذروة :00)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "تشغيل تجريبي بلا كتابة في المستودع"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "sync/**"
      - "site/**"
      - "scripts/build_pages.py"
      - "config/**"
      - "index.html"
      - "css/**"
      - "js/**"
      - ".github/workflows/sync.yml"

permissions: {}

concurrency:
  group: secure-sync-channel
  cancel-in-progress: false   # لا تُلغِ تشغيلًا منتصف الالتزام أبدًا

env:
  PYTHON_VERSION: "3.11"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # لدفع data/ المُنقّحة
      pages: write           # لنشر اللوحة
      id-token: write        # لنشر Pages عبر OIDC
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # الأسرار هنا أسماء فقط — القيم في GitHub Secrets ولا تُطبع أبدًا
      GOOGLE_DRIVE_ACCESS_TOKEN: ${{ secrets.GOOGLE_DRIVE_ACCESS_TOKEN }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
      GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      SYNC_VAULT_KEY: ${{ secrets.SYNC_VAULT_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Doctor (بلا شبكة، بلا قيم)
        run: python -m sync doctor

      - name: Run sync pipeline
        id: sync
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m sync run --dry-run
          else
            python -m sync run
          fi

      - name: Scan gate (دفاع ثانٍ على data/ قبل الدفع)
        # نفس قائمة الأسطح المعرّفة مرة واحدة في Makefile (SCAN_PATHS) — لا انجراف
        # بين CI الفاحص وCI الناشر. البوابة تفشل مُغلَقة عند أي مسار غير مقروء.
        run: make scan

      - name: Commit sanitized data
        if: inputs.dry_run != true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "لا تغييرات في البيانات المنقّحة."
          else
            git commit -m "chore(sync): hourly sanitized data refresh [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Setup Pages
        id: setup_pages
        continue-on-error: true   # التفعيل الأول قد يتطلب نقرة يدوية في الإعدادات
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Pages notice (عند تعذّر الإعداد)
        if: steps.setup_pages.outcome != 'success'
        run: |
          echo "::warning::GitHub Pages غير مفعّل بعد — القناة التزمت البيانات المُنقّحة بنجاح، لكن النشر العام متوقف حتى تفعيل Pages يدويًا مرة واحدة: Settings → Pages → Source: GitHub Actions. بعدها يُنشر تلقائيًا في التشغيل التالي."

      - name: Assemble Pages artifact (chat at /, dashboard at /sync/)
        if: steps.setup_pages.outcome == 'success'
        run: python scripts/build_pages.py

      - name: Upload Pages artifact
        if: steps.setup_pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.setup_pages.outcome == 'success'
        uses: actions/deploy-pages@v4
