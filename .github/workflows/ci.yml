name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Python tests
        run: python -m pytest -q
      - name: Interface translation tests
        run: node --test tests-js/*.test.js
      - name: Scan gate (published data, interface, config, and docs)
        run: python -m sync scan data site config docs js css tests-js index.html README.md SECURITY.md --gate
